name: Substrate pallet

# The Polkadot SDK build is large, so this runs only when the Substrate port
# changes. It runs both pallets' unit tests and builds the release WebAssembly
# runtime, so no_std regressions are caught. The live dev node is checked
# manually (see README, "Local node"). The shielded pallet's tests prove with
# crates/shielded-circuit, so those paths count too.
on:
  push:
    paths: ["substrate/**", "crates/shielded-circuit/**", "crates/shielded-model/**", ".github/workflows/substrate.yml"]
  pull_request:
    paths: ["substrate/**", "crates/shielded-circuit/**", "crates/shielded-model/**", ".github/workflows/substrate.yml"]
  # Manual runs (Actions tab > Substrate pallet > Run workflow). Path filters
  # do not fire on a branch's first push, e.g. into a new repository.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pallet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substrate
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: substrate
      - run: cargo test --locked -p pallet-anonymum
      - run: cargo test --locked -p pallet-anonymum-shielded

  wasm-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substrate
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: substrate
          key: wasm-runtime
      - run: cargo build --locked --release -p anonymum-runtime
      - name: Check the WebAssembly blob exists
        run: |
          blob=target/release/wbuild/anonymum-runtime/anonymum_runtime.compact.compressed.wasm
          test -s "$blob"
          echo "compressed runtime: $(wc -c < "$blob") bytes"

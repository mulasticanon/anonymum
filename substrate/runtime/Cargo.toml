[package]
name = "anonymum-runtime"
version = "0.1.0"
description = "Minimal solochain runtime with the Anonymum pallet (from the Polkadot SDK minimal template)."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
serde_json = { workspace = true }
polkadot-sdk = { workspace = true, features = [
	"pallet-balances",
	"pallet-sudo",
	"pallet-timestamp",
	"pallet-transaction-payment",
	"pallet-transaction-payment-rpc-runtime-api",
	"runtime",
	"sp-consensus-aura",
] }
pallet-anonymum = { workspace = true }
pallet-anonymum-shielded = { workspace = true }

[build-dependencies]
polkadot-sdk = { optional = true, workspace = true, features = ["substrate-wasm-builder"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-anonymum/std",
	"pallet-anonymum-shielded/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"serde_json/std",
]

# Substrate (Polkadot SDK) port of anonymum-core's chain rules.
# A separate workspace with its own Cargo.lock, so the Polkadot SDK's
# dependency tree cannot disturb the pinned Nym crates in the main workspace.
[workspace]
resolver = "2"
members = ["pallets/anonymum", "pallets/anonymum-shielded", "runtime"]

# Dual-licensed; the texts are LICENSE-MIT and LICENSE-APACHE at the repo root.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# polkadot-stable2609-2 ships the umbrella crate at 2609.3.0.
polkadot-sdk = { version = "=2609.3.0", default-features = false }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec", features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.132", default-features = false, features = ["alloc"] }
pallet-anonymum = { path = "pallets/anonymum", default-features = false }
pallet-anonymum-shielded = { path = "pallets/anonymum-shielded", default-features = false }

# Proving in the shielded pallet's tests is unusably slow unoptimised.
[profile.dev.package."ark-ff@0.4.2"]
opt-level = 3
[profile.dev.package."ark-ec@0.4.2"]
opt-level = 3
[profile.dev.package."ark-poly@0.4.2"]
opt-level = 3
[profile.dev.package."ark-bls12-381@0.4.0"]
opt-level = 3
[profile.dev.package."ark-groth16@0.4.0"]
opt-level = 3
[profile.dev.package."ark-relations@0.4.0"]
opt-level = 3
[profile.dev.package."ark-r1cs-std@0.4.0"]
opt-level = 3
[profile.dev.package."ark-crypto-primitives@0.4.0"]
opt-level = 3
[profile.dev.package.anonymum-shielded-circuit]
opt-level = 2
[profile.dev.package.pallet-anonymum-shielded]
opt-level = 2

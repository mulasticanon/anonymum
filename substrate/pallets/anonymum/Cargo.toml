[package]
name = "pallet-anonymum"
version = "0.1.0"
description = "Anonymum chain rules as a FRAME pallet: invites, paid contact requests with sealed notes, channels, blocks, fees."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
log = { version = "0.4.22", default-features = false }
# Only to refuse weak (small-order) invite keys at registration; no_std.
ed25519-dalek = { version = "2.2.0", default-features = false }
polkadot-sdk = { workspace = true, features = ["experimental", "runtime"] }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["experimental", "runtime", "pallet-balances", "std"] }

[features]
default = ["std"]
std = ["codec/std", "ed25519-dalek/std", "log/std", "polkadot-sdk/std", "scale-info/std"]

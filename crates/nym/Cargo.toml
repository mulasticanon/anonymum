[package]
name = "anonymum-nym"
version = "0.1.0"
edition = "2021"
description = "Anonymum over the Nym mixnet: encrypted chat between two wallets"
license.workspace = true

[dependencies]
anonymum-core = { path = "../core" }
anonymum-crypto = { path = "../crypto" }
nym-sdk = "1.21.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

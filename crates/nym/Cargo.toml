[package]
name = "murmur-nym"
version = "0.1.0"
edition = "2021"
description = "Murmur over the Nym mixnet: encrypted chat between two wallets"
license = "MIT OR Apache-2.0"

[dependencies]
murmur-core = { path = "../core" }
murmur-crypto = { path = "../crypto" }
nym-sdk = "1.21.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

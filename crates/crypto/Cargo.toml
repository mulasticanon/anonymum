[package]
name = "anonymum-crypto"
version = "0.1.0"
edition = "2021"
description = "Real cryptography for Anonymum: Ed25519 invites, identities, Noise sessions"
license = "MIT OR Apache-2.0"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
anonymum-core = { path = "../core" }
rand_core = { version = "0.6", features = ["getrandom"] }
snow = "0.10.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.9.2"
# FIPS 203 ML-KEM-768 (RustCrypto) for the hybrid post-quantum note, and
# BLAKE2s to commit to the ML-KEM key in the signed card.
ml-kem = { version = "=0.3.3", features = ["getrandom", "zeroize"] }
blake2 = "0.10.6"
# AEAD for the encrypted gate snapshot; the same pinned version the
# shielded model already uses (no lockfile change).
chacha20poly1305 = "=0.10.1"

[dev-dependencies]
# Already in the lockfile (via x25519-dalek); used only by tests to check
# that a note's ephemeral key lies on Curve25519.
curve25519-dalek = "=4.1.3"
